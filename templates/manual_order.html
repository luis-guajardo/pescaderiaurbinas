<aside class="form-panel compact manual-order"><p class="eyebrow">Pedido presencial</p><h2>Lista del cliente</h2><form method="post" action="{{ url_for('create_manual_order') }}"><label>Nombre del cliente<input name="customer_name" placeholder="Nombre completo" required></label><label>Producto<select name="product_id" required>{% for product in products %}<option value="{{ product['id'] }}">{{ product['name'] }}</option>{% endfor %}</select></label><div class="two-cols"><label>Cantidad<input name="quantity" type="number" step="0.1" min="0.1" value="1" required></label><label>Valor unitario CLP<input name="unit_price" type="number" step="1" min="0" required></label></div><label>Total cliente CLP<input name="total" type="number" step="1" min="0" required></label><button class="button full" type="submit">Guardar pedido del cliente</button></form></aside>
