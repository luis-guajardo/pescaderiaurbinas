<aside class="form-panel compact manual-order"><p class="eyebrow">Pedido presencial</p><h2>Lista del cliente</h2><form method="post" action="{{ url_for('create_manual_order') }}"><label>Nombre del cliente<input name="customer_name" placeholder="Nombre completo" required></label><div id="manual-items"><div class="manual-item"><label>Producto<select name="product_id[]" class="manual-product" required>{% for product in products %}<option value="{{ product['id'] }}" data-price="{{ product['price']|int }}">{{ product['name'] }}</option>{% endfor %}</select></label><div class="two-cols"><label>Cantidad<input name="quantity[]" class="manual-quantity" type="number" step="0.1" min="0.1" value="1" required></label><label>Valor unitario CLP<input name="unit_price[]" class="manual-price" type="number" step="1" min="0" value="{{ products[0]['price']|int if products else 0 }}" required></label></div><button class="remove-row" type="button" title="Quitar producto">Quitar producto</button></div></div><button class="button add-line" type="button">+ Agregar otro producto</button><label>Total cliente CLP<input id="manual-total" type="number" value="{{ products[0]['price']|int if products else 0 }}" readonly></label><button class="button full" type="submit">Guardar pedido del cliente</button></form></aside><script>(function(){const list=document.getElementById('manual-items');const total=document.getElementById('manual-total');function updateTotal(){let sum=0;list.querySelectorAll('.manual-item').forEach((row)=>{sum+=(Number(row.querySelector('.manual-quantity').value)||0)*(Number(row.querySelector('.manual-price').value)||0);});total.value=Math.round(sum);}function bind(row){row.querySelector('.manual-product').addEventListener('change',(event)=>{const price=event.target.selectedOptions[0]?.dataset.price||0;row.querySelector('.manual-price').value=price;updateTotal();});row.querySelector('.manual-quantity').addEventListener('input',updateTotal);row.querySelector('.manual-price').addEventListener('input',updateTotal);row.querySelector('.remove-row').addEventListener('click',()=>{if(list.children.length>1){row.remove();updateTotal();}});}bind(list.querySelector('.manual-item'));document.querySelector('.add-line').addEventListener('click',()=>{const copy=list.querySelector('.manual-item').cloneNode(true);copy.querySelector('.manual-quantity').value=1;copy.querySelector('.manual-price').value=copy.querySelector('.manual-product').selectedOptions[0]?.dataset.price||0;list.appendChild(copy);bind(copy);updateTotal();});updateTotal();})();</script>
