<section class="table-panel product-manager">
  <div class="panel-title"><div><p class="eyebrow">Catalogo completo</p><h2>Gestionar productos</h2></div><span class="hint">Edita precio, stock, datos o imagen</span></div>
  <div class="product-manager-list">
    {% for product in products %}
    <form class="product-editor" method="post" action="{{ url_for('update_product', product_id=product['id']) }}" enctype="multipart/form-data">
      <div class="editor-image"{% if product['image_path'] %} style="background-image:url('{{ url_for('static', filename=product['image_path']) }}')"{% endif %}><span>{{ product['name'][0] }}</span></div>
      <div class="editor-fields">
        <label>Nombre<input name="name" value="{{ product['name'] }}" required></label>
        <label>Categoria<input name="category" value="{{ product['category'] }}" required></label>
        <label>Descripcion<input name="description" value="{{ product['description'] }}"></label>
        <div class="two-cols"><label>Precio CLP<input name="price" type="number" step="1" min="0" value="{{ product['price']|int }}" required></label><label>Stock<input name="stock" type="number" step="0.1" min="0" value="{{ product['stock'] }}" required></label></div>
        <label>Reemplazar imagen<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label>
      </div>
      <div class="editor-actions"><button class="button" type="submit">Guardar</button></div>
    </form>
    <form class="delete-product" method="post" action="{{ url_for('delete_product', product_id=product['id']) }}" onsubmit="return confirm('¿Eliminar este producto del catalogo?');"><button class="remove" type="submit" title="Eliminar producto" aria-label="Eliminar {{ product['name'] }}">×</button></form>
    {% else %}<p class="hint">No hay productos en el catalogo.</p>{% endfor %}
  </div>
</section>
